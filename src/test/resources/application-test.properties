# MongoDB Configuration for Testing
# Uses local MongoDB server running on localhost:27017
spring.data.mongodb.uri=mongodb://localhost:27017/url_shortener
spring.data.mongodb.database=url_shortener

# URL Shortener Configuration
url.shortener.short-code-length=6
url.shortener.base-url=http://localhost:8080

# Logging
logging.level.com.urlshortener=DEBUG
